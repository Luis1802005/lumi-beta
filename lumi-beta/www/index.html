let IMP=[],W;const OB=new URL('ocr',location.href).href;

const rd=f=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=URL.createObjectURL(f)});
const spans=(a,th,gap,min)=>{const o=[];let s=-1;for(let i=0;i<=a.length;i++){const on=i<a.length&&a[i]>th;if(on&&s<0)s=i;if(!on&&s>=0){if(o.length&&s-o[o.length-1][1]<=gap)o[o.length-1][1]=i;else o.push([s,i]);s=-1}}return o.filter(x=>x[1]-x[0]>=min)};
function segm(img){const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,w,h).data;
const ok=i=>{const r=d[i],g=d[i+1],b=d[i+2];return(g>170&&r<125&&b<125&&g-r>55)||(r>225&&g>100&&g<195&&b<115&&r-b>105)},cx=new Array(w).fill(0),R=[];
for(let y=0;y<h;y+=2)for(let u=0;u<w;u+=2)if(ok((y*w+u)*4))cx[u]++;
spans(cx,3,6,60).forEach(([x0,x1])=>{const ry=new Array(h).fill(0);for(let y=0;y<h;y++)for(let u=x0;u<x1;u+=2)if(ok((y*w+u)*4))ry[y]++;spans(ry,(x1-x0)/2*.25,10,50).forEach(([y0,y1])=>R.push({x:x0,y:y0,w:x1-x0,h:y1-y0,cut:y1>=h-3}))});
R.sort((a,b)=>a.y-b.y||a.x-b.x);const mh=R.map(r=>r.h).sort((a,b)=>a-b)[Math.floor(R.length/2)];R.forEach(r=>{if(r.h<mh*.75)r.cut=true});return{c,R}}
async function ocrCard(R,c,w){const W2=R.w*2,H2=R.h*2,mk=f=>{const t=document.createElement('canvas');t.width=W2;t.height=H2;const q=t.getContext('2d',{willReadFrequently:true});q.drawImage(c,R.x,R.y,R.w,R.h,0,0,W2,H2);const im=q.getImageData(0,0,W2,H2),d=im.data;for(let i=0;i<d.length;i+=4){const v=f(d[i],d[i+1],d[i+2])?0:255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}q.putImageData(im,0,0);return t};
const A=await w.recognize(mk((r,g,b)=>.3*r+.59*g+.11*b<125)),B=await w.recognize(mk((r,g,b)=>Math.min(r,g,b)>205));return pcard(A.data.text,B.data.text)}
function chk(){IMP.forEach((x,i)=>{x.w=[];const ex=S.m.find(y=>norm(y.n)==norm(x.n));x.ex=!!ex;if(ex)x.w.push('Ya existe en Lumi: no se sobrescribe');if(!x.ses.length)x.w.push('Sin días ni horario');if(!x.s&&!x.e)x.w.push('Falta salón y edificio');if(x.cut)x.w.push('Tarjeta recortada en la captura');
const all=[...S.hr.filter(h=>!ex||h.m!=ex.id).map(h=>({n:mat(h.m).n,d:h.d,a:h.a,b:h.b})),...IMP.filter((y,j)=>j!=i&&y.on).flatMap(y=>y.ses.map(q=>({n:y.n,d:q.d,a:q.a,b:q.b})))],ov=new Set();
x.ses.forEach(q=>all.forEach(o=>{if(o.d==q.d&&tm(q.a)<tm(o.b)&&tm(o.a)<tm(q.b))ov.add(o.n)}));ov.forEach(n=>x.w.push('Se traslapa con '+n))})}
function rIMP(){chk();sh(`<h2>Tu horario está listo ✨</h2><p class="mu sm">Revisa, edita o descarta antes de importar. ${IMP.filter(x=>x.on).length} de ${IMP.length} seleccionadas.</p>${IMP.map((x,i)=>{const d=detect(x.n),c=CL[d?d.c:hc(x.n)];return `<div class="card pad" style="margin-top:10px;opacity:${x.on?1:.55}"><div style="display:flex;gap:10px;align-items:center"><button class="ck ${x.on?'on':''}" data-a="ik" data-i="${i}" aria-label="Seleccionar">${x.on?ic('chk',16,'#fff',2.6):''}</button><input data-ip="${i}.n" value="${esc(x.n)}" aria-label="Nombre" style="font-weight:700"></div><div class="mu sm" style="margin:8px 0 4px">${esc(x.pf)}${x.cr?' · '+esc(x.cr):''}</div>${x.ses.map(q=>`<span class="chip" style="background:${c[0]};color:${c[1]};margin:2px 4px 2px 0">${DN[q.d].slice(0,3)} ${q.a}–${q.b}</span>`).join('')}<div style="display:flex;gap:8px;margin-top:8px"><input data-ip="${i}.s" value="${esc(x.s)}" placeholder="Salón" aria-label="Salón"><input data-ip="${i}.e" value="${esc(x.e)}" placeholder="Edificio" aria-label="Edificio"></div>${x.w.map(w=>`<div class="sm" style="color:#A12F5C;margin-top:6px">⚠ ${w}</div>`).join('')}${x.ex?`<button class="sb sm" data-a="iad" data-i="${i}"><span class="ck ${x.add?'on':''}">${x.add?ic('chk',14,'#fff',2.6):''}</span>Añadir sus horarios a la materia existente</button>`:''}</div>`}).join('')}<button class="btn" data-a="imp2">Importar seleccionadas</button>`)}

ih2:async(i,el)=>{const fs=[...$('#hf').files],st=$('#hs');if(!fs.length){st.textContent='Elige al menos una captura.';return}el.disabled=true;IMP=[];try{st.textContent='Cargando reconocimiento de texto…';const w=await ldW();for(let k=0;k<fs.length;k++){const img=await rd(fs[k]),{c,R}=segm(img);if(!R.length){st.textContent='No encontré tarjetas en la captura '+(k+1)+'.';continue}for(let j=0;j<R.length;j++){st.textContent='Captura '+(k+1)+'/'+fs.length+' · tarjeta '+(j+1)+'/'+R.length;const o=await ocrCard(R[j],c,w);o.cut=R[j].cut;if(!o.n)continue;const e=IMP.find(y=>norm(y.n)==norm(o.n));if(e){o.ses.forEach(q=>{if(!e.ses.some(z=>z.d==q.d&&z.a==q.a))e.ses.push(q)});e.s=e.s||o.s;e.e=e.e||o.e}else IMP.push(o)}}
