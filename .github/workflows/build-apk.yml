name: Construir APK de Lumi Beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar carpeta del proyecto
        run: |
          echo "APPDIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        working-directory: ${{ env.APPDIR }}
        run: npm install
      - name: Preparar OCR local en español
        working-directory: ${{ env.APPDIR }}
        run: |
          mkdir -p www/ocr
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js www/ocr/
          cp node_modules/tesseract.js-core/tesseract-core* www/ocr/
          curl -L -o www/ocr/spa.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/spa.traineddata
          gzip -f www/ocr/spa.traineddata
          ls -la www/ocr
      - name: Crear proyecto Android
        working-directory: ${{ env.APPDIR }}
        run: npx cap add android
      - name: Generar iconos de Lumi
        working-directory: ${{ env.APPDIR }}
        run: npx @capacitor/assets generate --android
        continue-on-error: true
      - name: Sincronizar
        working-directory: ${{ env.APPDIR }}
        run: npx cap sync android
      - name: Compilar APK
        working-directory: ${{ env.APPDIR }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - name: Renombrar APK
        working-directory: ${{ env.APPDIR }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LumiBeta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LumiBeta-apk
          path: ${{ env.APPDIR }}/LumiBeta.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Lumi Beta ${{ github.run_number }}
          files: ${{ env.APPDIR }}/LumiBeta.apk
